<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%" style="background:#090d16;border-radius:16px;overflow:hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#0a1020" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filter Effects -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1) translate(0, 0); }
        50% { opacity: 0.65; transform: scale(1.08) translate(15px, -10px); }
      }

      @keyframes floatOrb {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(-20px, 15px); }
      }

      @keyframes dashStream {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }

      @keyframes pillPulse {
        0%, 100% { border-color: rgba(56, 189, 248, 0.4); }
        50% { border-color: rgba(192, 132, 252, 0.8); }
      }

      .glow-orb-cyan {
        animation: pulseGlow 8s ease-in-out infinite;
        transform-origin: center;
      }

      .glow-orb-purple {
        animation: floatOrb 10s ease-in-out infinite;
        transform-origin: center;
      }

      .data-line {
        stroke-dasharray: 12, 16;
        animation: dashStream 14s linear infinite;
      }

      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }

      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        fill: #94a3b8;
      }

      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #38bdf8;
      }
    </style>
  </defs>

  <!-- Deep Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Animated Glowing Ambience (Strictly in Background) -->
  <g opacity="0.7">
    <circle class="glow-orb-cyan" cx="180" cy="120" r="140" fill="url(#accentCyan)" filter="url(#glowCyan)" />
    <circle class="glow-orb-purple" cx="1020" cy="280" r="170" fill="url(#accentPurple)" filter="url(#glowPurple)" />
    <circle class="glow-orb-cyan" cx="620" cy="350" r="110" fill="#0ea5e9" opacity="0.2" filter="url(#glowCyan)" />
  </g>

  <!-- Technical Grid Background -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="160" y1="0" x2="160" y2="400" />
    <line x1="360" y1="0" x2="360" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="840" y1="0" x2="840" y2="400" />
    <line x1="1040" y1="0" x2="1040" y2="400" />
  </g>

  <!-- Animated Dynamic Data Stream Circuit (Behind Text) -->
  <g fill="none" opacity="0.45">
    <path class="data-line" d="M 60,340 L 260,340 L 320,280 L 880,280 L 940,340 L 1140,340" stroke="#38bdf8" stroke-width="2.5" />
    <path class="data-line" d="M 120,60 L 380,60 L 440,120 L 760,120 L 820,60 L 1080,60" stroke="#c084fc" stroke-width="2" style="animation-direction: reverse; animation-duration: 18s;" />
  </g>

  <!-- Core Content Container (Foreground with high contrast drop shadow) -->
  <g filter="url(#dropShadow)">
    <!-- Top Super-Badge Pill -->
    <g transform="translate(415, 48)">
      <rect x="0" y="0" width="370" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
      <circle cx="18" cy="17" r="5" fill="#10b981">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8" letter-spacing="1.2">ENTERPRISE GPU &amp; DEDICATED PLATFORMS</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="152" text-anchor="middle" class="title-text" font-size="39">
      Managed Enterprise Dedicated Platforms
    </text>

    <!-- Gradient Accent Sub-Heading -->
    <text x="600" y="196" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="url(#primaryGrad)">
      Dedicated GPU Clusters • High-Throughput Model Serving • Enterprise SLAs
    </text>

    <!-- Descriptive Subtitle -->
    <text x="600" y="235" text-anchor="middle" class="sub-text" font-size="14.5">
      The definitive directory of managed GPU inference clouds, dedicated endpoints &amp; open-source orchestration
    </text>

    <!-- Feature Feature Cards / Interactive Badges in Foreground -->
    <g transform="translate(180, 282)">
      <!-- Card 1: Dedicated GPU -->
      <g transform="translate(0, 0)">
        <rect width="195" height="52" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" opacity="0.9" />
        <rect x="0" y="0" width="4" height="52" rx="2" fill="#38bdf8" />
        <text x="18" y="23" font-family="sans-serif" font-size="14">⚡</text>
        <text x="40" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Dedicated GPUs</text>
        <text x="40" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">H100 / B200 / L40S</text>
      </g>

      <!-- Card 2: Enterprise SLAs -->
      <g transform="translate(215, 0)">
        <rect width="195" height="52" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" opacity="0.9" />
        <rect x="0" y="0" width="4" height="52" rx="2" fill="#818cf8" />
        <text x="18" y="23" font-family="sans-serif" font-size="14">🛡️</text>
        <text x="40" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Guaranteed SLAs</text>
        <text x="40" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">99.9% Uptime &amp; TTFT</text>
      </g>

      <!-- Card 3: Kubernetes Native -->
      <g transform="translate(430, 0)">
        <rect width="195" height="52" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" opacity="0.9" />
        <rect x="0" y="0" width="4" height="52" rx="2" fill="#a855f7" />
        <text x="18" y="23" font-family="sans-serif" font-size="14">☸️</text>
        <text x="40" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">K8s Orchestration</text>
        <text x="40" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">Run:ai / Kaito / Ray</text>
      </g>

      <!-- Card 4: Open Source -->
      <g transform="translate(645, 0)">
        <rect width="195" height="52" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" opacity="0.9" />
        <rect x="0" y="0" width="4" height="52" rx="2" fill="#10b981" />
        <text x="18" y="23" font-family="sans-serif" font-size="14">🔓</text>
        <text x="40" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Zero Lock-In</text>
        <text x="40" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">vLLM / SGLang / KServe</text>
      </g>
    </g>
  </g>

  <!-- Border Highlight -->
  <rect x="1" y="1" width="1198" height="398" rx="15" fill="none" stroke="url(#primaryGrad)" stroke-width="1" opacity="0.3" />
</svg>
